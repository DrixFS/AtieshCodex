services:
  redis:
    image: redis:7-alpine
    container_name: atiesh-codex-redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: atiesh-codex-server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - '3001:3001'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3001/api/ping || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: atiesh-codex-client
    ports:
      - '80:80'
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
    driver: local
