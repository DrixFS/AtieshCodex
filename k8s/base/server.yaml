apiVersion: apps/v1
kind: Deployment
metadata:
  name: atiesh-codex-server
  namespace: atiesh-codex
  labels:
    app.kubernetes.io/name: atiesh-codex-server
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: atiesh-codex-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atiesh-codex-server
  template:
    metadata:
      labels:
        app: atiesh-codex-server
        app.kubernetes.io/name: atiesh-codex-server
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: atiesh-codex-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: atiesh-codex-config
            - secretRef:
                name: atiesh-codex-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atiesh-codex-server
  namespace: atiesh-codex
  labels:
    app.kubernetes.io/name: atiesh-codex-server
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: atiesh-codex-app
spec:
  type: ClusterIP
  selector:
    app: atiesh-codex-server
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
