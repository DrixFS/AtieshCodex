apiVersion: apps/v1
kind: Deployment
metadata:
  name: atiesh-codex-client
  namespace: atiesh-codex
  labels:
    app.kubernetes.io/name: atiesh-codex-client
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: atiesh-codex-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atiesh-codex-client
  template:
    metadata:
      labels:
        app: atiesh-codex-client
        app.kubernetes.io/name: atiesh-codex-client
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: client
          image: atiesh-codex-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atiesh-codex-client
  namespace: atiesh-codex
  labels:
    app.kubernetes.io/name: atiesh-codex-client
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: atiesh-codex-app
spec:
  type: ClusterIP
  selector:
    app: atiesh-codex-client
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
